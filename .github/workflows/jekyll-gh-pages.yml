# Build and deploy a React app to GitHub Pages
name: Deploy React app to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  repository_dispatch:
    types: [backend-updated]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.backend.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve latest backend
        id: backend
        working-directory: backend
        run: |
          git fetch --no-tags origin main
          git checkout --detach origin/main
          echo "Using backend snapshot commit $(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Test backend snapshot
        run: CI=true npm test -- --watchAll=false
      - name: Build React app
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Record the backend commit that was just deployed as this repo's submodule
  # pointer, so `main` always matches what is live. Pushes made with
  # GITHUB_TOKEN do not trigger workflows, so this cannot loop.
  bump-backend-pointer:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Commit submodule bump if needed
        env:
          BACKEND_SHA: ${{ needs.build.outputs.backend_sha }}
        run: |
          git -C backend fetch --no-tags origin main
          git -C backend checkout --detach "$BACKEND_SHA"
          if git diff --quiet -- backend; then
            echo "backend pointer already at $BACKEND_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "chore: bump backend to ${BACKEND_SHA::7}"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
